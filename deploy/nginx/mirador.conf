# ===========================================================================
#  nginx para MIRADOR 2027 en un VPS: sirve el sitio (DemoVotehub, archivos
#  estáticos) y reenvía /api/ y /health a mirador-backend (127.0.0.1:8001).
#  Sitio y API quedan en el mismo dominio: no hace falta CORS ni abrir el 8001.
#
#  Instalar (reemplaza mirador.ejemplo.mx por tu dominio):
#    sudo cp deploy/nginx/mirador.conf /etc/nginx/sites-available/mirador
#    sudo ln -s /etc/nginx/sites-available/mirador /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d mirador.ejemplo.mx      # HTTPS (agrega el bloque 443)
# ===========================================================================

# Límite de peticiones a la API por IP (evita abusos; la app hace ~10 por vista).
limit_req_zone $binary_remote_addr zone=mirador_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name mirador.ejemplo.mx;

    root /opt/mirador/DemoVotehub;
    index index.html;
    charset utf-8;

    # Compresión: los GeoJSON municipales pesan varios MB y se reducen ~80 %.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/geo+json text/csv image/svg+xml;

    # ---------------- API (mirador-backend) ----------------
    location /api/ {
        limit_req zone=mirador_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8001;
    }
    # Lanzar el pipeline desde fuera no es necesario (lo hace el programa periódico).
    # Quita este bloque solo si vas a usar POST /api/v1/pipeline/run con X-API-Key.
    location = /api/v1/pipeline/run {
        return 403;
    }

    # ---------------- Sitio estático (DemoVotehub) ----------------
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    # JS/CSS sin hash en el nombre: el navegador revalida (ETag) y toma cambios al desplegar.
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache";
    }
    location ~* \.geojson$ {
        types { }
        default_type application/geo+json;
        expires 7d;
    }
    location ~* \.(?:png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        expires 30d;
    }
    location ~* \.csv$ {
        types { }
        default_type text/csv;
        add_header Cache-Control "no-cache";
    }

    # No publicar archivos de trabajo del proyecto.
    location ~ /\.                     { deny all; }
    location ~* \.(?:py|pyc|mjs|md|xlsx|zip|sh|bat|log)$ { deny all; }
    location ^~ /gub2021/              { deny all; }
    location ^~ /deploy/               { deny all; }
}
